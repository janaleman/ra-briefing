name: Morning briefing

on:
  schedule:
    # Fallback only: GitHub often starts scheduled runs late. The Cloudflare
    # Worker (src/index.js) dispatches this workflow every 30 minutes on time.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the live briefing is fresh"
        type: boolean
        default: false

concurrency:
  group: briefing
  cancel-in-progress: false  # a newer run waits; GitHub keeps only the latest one queued

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Skip if a fresh briefing was just published
        id: gate
        run: |
          # Both the Cloudflare cron and GitHub's schedule can start a run;
          # build only if the live briefing is more than 20 minutes old.
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "Forced rebuild"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          gen=$(curl -s "https://ra-briefing.ra-briefing.workers.dev/?nocache=$(date +%s)" | grep -oE 'name="generated" content="[^"]+"' | cut -d'"' -f4 || true)
          age=999
          if [ -n "$gen" ]; then age=$(( ($(date +%s) - $(date -d "$gen" +%s)) / 60 )); fi
          if [ "$age" -lt 20 ]; then
            echo "Skipping: live briefing is ${age} min old"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building (live briefing is ${age} min old)"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Build briefing
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAA_CLIENT_ID: ${{ secrets.FAA_CLIENT_ID }}
          FAA_CLIENT_SECRET: ${{ secrets.FAA_CLIENT_SECRET }}
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
        run: python briefing.py

      - name: Deploy to Cloudflare
        if: steps.gate.outputs.run == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.141.0"
          command: deploy
