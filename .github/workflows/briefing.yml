name: Morning briefing

on:
  schedule:
    # 9:00 America/Denver is 15:00 UTC in summer (MDT) and 16:00 UTC in winter (MST).
    # Both run; the time check below lets only the 9 AM one through.
    - cron: "0 15 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Only run at 9 AM Denver time
        id: gate
        run: |
          hour=$(TZ=America/Denver date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$hour" = "09" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping: it is ${hour}:xx in Denver"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Build briefing
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAA_CLIENT_ID: ${{ secrets.FAA_CLIENT_ID }}
          FAA_CLIENT_SECRET: ${{ secrets.FAA_CLIENT_SECRET }}
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
        run: python briefing.py

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.run == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=ra-briefing --branch=main --commit-dirty=true
