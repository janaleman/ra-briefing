name: Morning briefing

on:
  schedule:
    # GitHub often starts scheduled runs hours late, so try every hour from
    # 9 AM Denver onward (15:17 UTC in summer, 16:17 in winter). The gate below
    # builds on the first attempt after 9 AM and skips the rest once today's
    # briefing is live. :17 avoids the top-of-hour scheduling backlog.
    - cron: "17 15-23 * * *"
  workflow_dispatch:

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Build once a day, after 9 AM Denver time
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          hour=$(TZ=America/Denver date +%-H)
          if [ "$hour" -lt 9 ]; then
            echo "Skipping: it is only ${hour}:xx in Denver"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The briefing archives itself under the Alaska date; if today's copy
          # is already live, an earlier run has done the job.
          today=$(TZ=America/Anchorage date +%F)
          code=$(curl -sL -o /dev/null -w "%{http_code}" "https://ra-briefing.ra-briefing.workers.dev/archive/briefing-${today}.html")
          if [ "$code" = "200" ]; then
            echo "Skipping: briefing for ${today} is already published"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building briefing for ${today}"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Build briefing
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAA_CLIENT_ID: ${{ secrets.FAA_CLIENT_ID }}
          FAA_CLIENT_SECRET: ${{ secrets.FAA_CLIENT_SECRET }}
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
        run: python briefing.py

      - name: Deploy to Cloudflare
        if: steps.gate.outputs.run == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.141.0"
          command: deploy
